<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <filter id="paper-texture-filter" x="0%" y="0%" width="100%" height="100%">
    <!-- High frequency fine grain + subtle paper fibers -->
    <feTurbulence type="fractalNoise" baseFrequency="0.75" numOctaves="4" stitchTiles="stitch" result="noise" />
    <feColorMatrix type="matrix" values="
      0.33 0.33 0.33 0 0
      0.33 0.33 0.33 0 0
      0.33 0.33 0.33 0 0
      0    0    0    0.35 0" in="noise" result="coloredNoise" />
    <feComponentTransfer in="coloredNoise" result="subtleNoise">
      <feFuncA type="linear" slope="0.45" />
    </feComponentTransfer>
    <feBlend mode="multiply" in="SourceGraphic" in2="subtleNoise" />
  </filter>

  <!-- Background base with natural handmade paper tooth -->
  <rect width="100%" height="100%" fill="#111016" />
  <rect width="100%" height="100%" filter="url(#paper-texture-filter)" fill="#252430" opacity="0.3" />
  
  <!-- Subtle fiber specks -->
  <g opacity="0.12" fill="#E8D5F2">
    <circle cx="45" cy="85" r="0.8" />
    <circle cx="120" cy="30" r="0.6" />
    <circle cx="210" cy="150" r="1.1" />
    <circle cx="340" cy="70" r="0.7" />
    <circle cx="80" cy="270" r="0.9" />
    <circle cx="190" cy="310" r="0.8" />
    <circle cx="300" cy="240" r="1.0" />
    <circle cx="360" cy="350" r="0.7" />
    <circle cx="15" cy="190" r="0.6" />
    <circle cx="260" cy="20" r="0.8" />
  </g>
</svg>
